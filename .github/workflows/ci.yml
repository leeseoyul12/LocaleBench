name: LocaleBench checks
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm run install:ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: npm run test:worker
      - run: npx playwright install --with-deps chromium
      - name: Start local servers
        run: |
          npm run dev -- --host 127.0.0.1 --port 5173 > /tmp/localebench-dev.log 2>&1 &
          for n in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:5173/api/status; then exit 0; fi
            sleep 1
          done
          cat /tmp/localebench-dev.log
          exit 1
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: test-results
          retention-days: 7
